name: Run Drama Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Radar scan
        run: python radar/run.py
      - name: Commit updated Radar
        run: |
          git config user.name "Drama Radar"
          git config user.email "actions@users.noreply.github.com"
          git add drama-radar.json radar-stats.json archive/
          git diff --cached --quiet || git commit -m "Automated Drama Radar scan"
          git push
