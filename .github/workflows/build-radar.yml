name: Build Drama Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *" # Runs every 15 minutes

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser yt-dlp

      - name: Build Drama Radar
        run: python build_radar.py

      - name: Save updated Radar
        run: |
          git config user.name "Drama Radar Bot"
          git config user.email "actions@github.com"
          git add drama-radar.json
          git diff --cached --quiet || git commit -m "Update Drama Radar"
          git push
